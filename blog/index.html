<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog – Silvia Sapora</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 60px;
            font-size: 16px;
        }

        /* NAV */
        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
            padding: 1.1rem 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid #eee;
        }
        nav .site-name {
            font-weight: 700;
            color: #111;
            margin-right: auto;
            text-decoration: none;
            font-size: 1rem;
        }
        nav a { color: #555; text-decoration: none; font-size: 0.92rem; }
        nav a:hover { color: #0066cc; }
        nav a.active { color: #111; font-weight: 600; }

        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }

        h1 {
            font-size: 2em;
            color: #111;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        /* CARD GRID */
        .card-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 1.4rem 1.5rem;
            display: flex;
            flex-direction: column;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .card:hover {
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-date {
            font-size: 0.8rem;
            color: #999;
            font-family: monospace;
            letter-spacing: 0.02em;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #111;
            margin-bottom: 0.6rem;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.88rem;
            color: #555;
            flex: 1;
            line-height: 1.5;
            margin-bottom: 1.1rem;
        }

        .card-link {
            font-size: 0.88rem;
            font-weight: 600;
            color: #0066cc;
        }
        .card-link:hover { text-decoration: underline; }

        @media (max-width: 560px) {
            .card-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="site-name">Silvia Sapora</a>
        <a href="/">Home</a>
        <a href="/blog/" class="active">Blog</a>
    </nav>

    <h1>Blog</h1>

    <div class="card-grid">

        <div class="card">
            <div class="card-date">June 2026</div>
            <div class="card-title">ML Job Interviews: The Ultimate Guide</div>
            <div class="card-desc">How I found a Research Scientist role after a PhD in Machine Learning — interviews, prep, negotiation, the emotional side, and everything in between.</div>
            <a class="card-link" href="/blog/ml-interviews.html">Read article →</a>
        </div>

        <!-- Add future posts here, copy the card block above -->

    </div>

    <div style="margin-top: 60px; font-size: 0.8em; color: #999;">
        &copy; 2026 Silvia Sapora.
    </div>

</body>
</html>
